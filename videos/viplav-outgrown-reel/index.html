                y: 0,
                rotation: 0,
                opacity: 1,

        const SHAKE = [
          [0.04, -18, 10, -0.6],
          [0.08, 16, -8, 0.5],
          [0.12, -10, 6, -0.3],
          [0.16, 6, -3, 0.2],

              .map(function (p) {

        function easeOut3(x) {
          return 1 - Math.pow(1 - x, 3);

            if (!seg.drift) return [seg.s, 0];

              if (x < p.t) return prev(x);
              const k = easeOut3(Math.min(1, (x - p.t) / PUNCH_IN));

          if (t < c.in - HALF_FRAME || t >= c.out) return null;

          let y = tr[0][2];
          for (let i = 0; i < tr.length - 1; i++) {

        });
