<!doctype html>
<!--
  B-roll C: "the business is ready".
  A BUSINESS progress bar loads while the counter climbs, hits 100% on "ready" and a
  READY stamp slams in. The end state holds still so the paper rip (main timeline,
  15.10s) can tear a snapshot of it away to reveal the speaker.
  Local times are cued to the speaker's words (scene starts at 13.29s on the main timeline).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Montserrat", sans-serif;
          color: #f7f7f2;
        }
        .rd-stage {
          position: absolute;
          inset: 0;
          background: radial-gradient(120% 80% at 50% 38%, #24242b 0%, #0c0c0f 70%);
        }
        .rd-grid {
          position: absolute;
          inset: 0;
          background:
            repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.045) 0 2px, transparent 2px 96px),
            repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.045) 0 2px, transparent 2px 96px);
        }
        .rd-title {
          position: absolute;
          left: 0;
          right: 0;
          top: 300px;
          text-align: center;
          font-weight: 900;
          font-size: 100px;
          letter-spacing: -0.03em;
          line-height: 1;
        }
        .rd-frame {
          position: absolute;
          left: 110px;
          width: 860px;
          top: 450px;
          height: 150px;
          border: 8px solid #f7f7f2;
          border-radius: 34px;
        }
        .rd-fill {
          position: absolute;
          left: 10px;
          top: 10px;
          right: 10px;
          bottom: 10px;
          border-radius: 22px;
          background: repeating-linear-gradient(-45deg, #ffe11a 0 34px, #ffd000 34px 68px);
          transform-origin: 0% 50%;
        }
        .rd-pct {
          position: absolute;
          left: 0;
          right: 0;
          top: 650px;
          text-align: center;
          font-weight: 900;
          font-size: 150px;
          letter-spacing: -0.04em;
          line-height: 1;
          color: #ffe11a;
          text-shadow: 0 8px 0 rgba(0, 0, 0, 0.5);
        }
        .rd-stamp-wrap {
          position: absolute;
          left: 0;
          right: 0;
          top: 830px;
          height: 210px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .rd-stamp {
          display: flex;
          align-items: center;
          gap: 26px;
          padding: 18px 46px;
          border: 12px solid #ffe11a;
          border-radius: 28px;
          background: rgba(12, 12, 15, 0.85);
          color: #ffe11a;
          font-weight: 900;
          font-size: 140px;
          letter-spacing: -0.03em;
          line-height: 1;
          box-shadow: 0 0 90px rgba(255, 225, 26, 0.35);
        }
        .rd-check {
          display: block;
          width: 120px;
          height: 120px;
        }
      </style>

      <div id="root" data-composition-id="broll-ready" data-width="1080" data-height="1920">
        <div class="rd-stage" id="rd-stage" data-layout-allow-overflow>
          <div class="rd-grid"></div>
          <div class="rd-title" id="rd-title">BUSINESS</div>
          <div class="rd-frame"><div class="rd-fill" id="rd-fill"></div></div>
          <div class="rd-pct" id="rd-pct">0%</div>
          <div class="rd-stamp-wrap">
            <div class="rd-stamp" id="rd-stamp">
              READY
              <svg class="rd-check" viewBox="0 0 100 100" aria-hidden="true">
                <path
                  d="M 14 54 L 40 80 L 88 22"
                  fill="none"
                  stroke="#ffe11a"
                  stroke-width="16"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const pct = document.getElementById("rd-pct");
          const fill = document.getElementById("rd-fill");

          tl.fromTo(
            "#rd-stage",
            { scale: 1.14, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.2, ease: "power3.out" },
            0,
          );
          tl.fromTo(
            "#rd-title",
            { y: 50, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.24, ease: "back.out(2)" },
            0.26,
          );

          // The bar loads under "the business is" and snaps to 100% on "ready".
          const load = { p: 0 };
          function paint() {
            gsap.set(fill, { scaleX: load.p });
            pct.textContent = Math.round(load.p * 100) + "%";
          }
          paint();
          tl.fromTo(
            load,
            { p: 0 },
            { p: 0.86, duration: 1.05, ease: "power1.inOut", onUpdate: paint },
            0.1,
          );
          tl.fromTo(
            load,
            { p: 0.86 },
            { p: 1, duration: 0.12, ease: "power3.out", immediateRender: false, onUpdate: paint },
            1.29,
          );

          tl.fromTo(
            "#rd-stamp",
            { scale: 2.4, rotation: 6, opacity: 0 },
            { scale: 1, rotation: -6, opacity: 1, duration: 0.2, ease: "back.out(2.2)" },
            1.41,
          );
          tl.to(
            "#rd-stage",
            {
              keyframes: [
                { x: -12, y: 8, duration: 0.04 },
                { x: 10, y: -6, duration: 0.04 },
                { x: 0, y: 0, duration: 0.05 },
              ],
            },
            1.5,
          );

          window.__timelines["broll-ready"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
