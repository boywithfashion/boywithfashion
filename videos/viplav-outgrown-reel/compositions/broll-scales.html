<!doctype html>
<!--
  B-roll B: "different scales of business, different challenges".
  A shop, an office and a tower rise one after another with an arrow climbing over them;
  on "challenges" each building takes a red warning badge, bigger building, bigger badge.
  Local times are cued to the speaker's words (scene starts at 8.25s on the main timeline).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Montserrat", sans-serif;
          color: #f7f7f2;
        }
        .sc-stage {
          position: absolute;
          inset: 0;
          background: radial-gradient(120% 80% at 50% 38%, #24242b 0%, #0c0c0f 70%);
        }
        .sc-grid {
          position: absolute;
          inset: 0;
          background:
            repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.045) 0 2px, transparent 2px 96px),
            repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.045) 0 2px, transparent 2px 96px);
        }
        .sc-ground {
          position: absolute;
          left: 90px;
          right: 90px;
          top: 990px;
          height: 6px;
          border-radius: 3px;
          background: rgba(255, 255, 255, 0.3);
        }
        .sc-city {
          position: absolute;
          inset: 0;
        }
        .sc-bld {
          position: absolute;
          bottom: 930px;
          border: 6px solid rgba(247, 247, 242, 0.9);
          border-bottom: none;
          border-radius: 12px 12px 0 0;
          background-color: #2b2b33;
          background-image:
            repeating-linear-gradient(0deg, transparent 0 26px, #2b2b33 26px 58px),
            repeating-linear-gradient(90deg, transparent 0 22px, rgba(255, 225, 26, 0.75) 22px 46px, transparent 46px 68px);
          background-position: 6px 40px;
          transform-origin: 50% 100%;
        }
        .sc-shop {
          left: 120px;
          width: 210px;
          height: 190px;
        }
        .sc-awning {
          position: absolute;
          left: -6px;
          right: -6px;
          top: -6px;
          height: 38px;
          border-radius: 10px 10px 0 0;
          background: repeating-linear-gradient(90deg, #ffe11a 0 30px, #f7f7f2 30px 60px);
        }
        .sc-office {
          left: 395px;
          width: 250px;
          height: 400px;
        }
        .sc-tower {
          left: 710px;
          width: 260px;
          height: 740px;
        }
        .sc-antenna {
          position: absolute;
          left: 50%;
          top: -80px;
          width: 10px;
          height: 74px;
          margin-left: -5px;
          border-radius: 5px;
          background: #f7f7f2;
        }
        .sc-arrow {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1920px;
          overflow: visible;
        }
        .sc-badge {
          position: absolute;
          display: block;
        }
        .sc-badge-1 {
          left: 165px;
          top: 770px;
          width: 120px;
          height: 120px;
        }
        .sc-badge-2 {
          left: 435px;
          top: 610px;
          width: 170px;
          height: 170px;
        }
        .sc-badge-3 {
          left: 720px;
          top: 350px;
          width: 240px;
          height: 240px;
        }
        .sc-flash {
          position: absolute;
          inset: 0;
          background: #ff2b2b;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="broll-scales" data-width="1080" data-height="1920">
        <div class="sc-stage" id="sc-stage" data-layout-allow-overflow>
          <div class="sc-grid"></div>
          <div class="sc-city" id="sc-city">
            <div class="sc-ground"></div>
            <div class="sc-bld sc-shop" id="sc-shop"><div class="sc-awning"></div></div>
            <div class="sc-bld sc-office" id="sc-office"></div>
            <div class="sc-bld sc-tower" id="sc-tower"><div class="sc-antenna"></div></div>
            <svg class="sc-arrow" viewBox="0 0 1080 1920" aria-hidden="true">
              <path
                id="sc-arrow-path"
                d="M 200 720 L 500 520 L 800 170"
                fill="none"
                stroke="#ffe11a"
                stroke-width="16"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                id="sc-arrow-head"
                d="M 742 176 L 800 170 L 806 230"
                fill="none"
                stroke="#ffe11a"
                stroke-width="16"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <svg class="sc-badge sc-badge-1" id="sc-badge-1" viewBox="0 0 100 100" aria-hidden="true">
            <path d="M50 6 L96 90 L4 90 Z" fill="#ff2b2b" stroke="#0c0c0f" stroke-width="5" stroke-linejoin="round" />
            <rect x="45" y="34" width="10" height="32" rx="5" fill="#f7f7f2" />
            <circle cx="50" cy="77" r="6" fill="#f7f7f2" />
          </svg>
          <svg class="sc-badge sc-badge-2" id="sc-badge-2" viewBox="0 0 100 100" aria-hidden="true">
            <path d="M50 6 L96 90 L4 90 Z" fill="#ff2b2b" stroke="#0c0c0f" stroke-width="5" stroke-linejoin="round" />
            <rect x="45" y="34" width="10" height="32" rx="5" fill="#f7f7f2" />
            <circle cx="50" cy="77" r="6" fill="#f7f7f2" />
          </svg>
          <svg class="sc-badge sc-badge-3" id="sc-badge-3" viewBox="0 0 100 100" aria-hidden="true">
            <path d="M50 6 L96 90 L4 90 Z" fill="#ff2b2b" stroke="#0c0c0f" stroke-width="5" stroke-linejoin="round" />
            <rect x="45" y="34" width="10" height="32" rx="5" fill="#f7f7f2" />
            <circle cx="50" cy="77" r="6" fill="#f7f7f2" />
          </svg>
          <div class="sc-flash" id="sc-flash"></div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          tl.fromTo(
            "#sc-stage",
            { scale: 1.14, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.2, ease: "power3.out" },
            0,
          );

          // "different / scales / of business" -> shop, office, tower rise in turn.
          tl.fromTo("#sc-shop", { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "back.out(1.8)" }, 0.06);
          tl.fromTo("#sc-office", { scaleY: 0 }, { scaleY: 1, duration: 0.34, ease: "back.out(1.6)" }, 0.4);
          tl.fromTo("#sc-tower", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "back.out(1.4)" }, 0.88);

          // The arrow climbs over the three as "business" lands.
          const arrow = document.getElementById("sc-arrow-path");
          const arrowLen = arrow.getTotalLength();
          gsap.set(arrow, { strokeDasharray: arrowLen });
          // Hidden until it draws: a fully offset dash still paints its round cap as a dot.
          tl.fromTo(arrow, { opacity: 0 }, { opacity: 1, duration: 0.01 }, 1.04);
          tl.fromTo(
            arrow,
            { strokeDashoffset: arrowLen },
            { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" },
            1.04,
          );
          tl.fromTo("#sc-arrow-head", { opacity: 0 }, { opacity: 1, duration: 0.08 }, 1.46);

          // "different challenges" -> the city dims and red warnings slam onto every building.
          tl.fromTo(
            "#sc-city",
            { filter: "brightness(1) saturate(1)" },
            { filter: "brightness(0.55) saturate(0.6)", duration: 0.25 },
            1.84,
          );
          [
            ["#sc-badge-1", 2.16],
            ["#sc-badge-2", 2.3],
            ["#sc-badge-3", 2.44],
          ].forEach(function (b) {
            tl.fromTo(
              b[0],
              { scale: 2.6, rotation: -18, opacity: 0 },
              { scale: 1, rotation: 0, opacity: 1, duration: 0.18, ease: "back.out(2.4)" },
              b[1],
            );
          });
          tl.fromTo("#sc-flash", { opacity: 0 }, { opacity: 0.32, duration: 0.05 }, 2.16);
          tl.fromTo(
            "#sc-flash",
            { opacity: 0.32 },
            { opacity: 0, duration: 0.22, immediateRender: false },
            2.21,
          );
          tl.to(
            "#sc-stage",
            {
              keyframes: [
                { x: -16, y: 10, duration: 0.04 },
                { x: 14, y: -8, duration: 0.04 },
                { x: -10, y: 6, duration: 0.04 },
                { x: 8, y: -4, duration: 0.04 },
                { x: 0, y: 0, duration: 0.05 },
              ],
            },
            2.2,
          );

          tl.to("#sc-stage", { xPercent: -105, duration: 0.13, ease: "power2.in" }, 3.11);

          window.__timelines["broll-scales"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
