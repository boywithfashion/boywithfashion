<!doctype html>
<!--
  B-roll A: "the skills that build a 5 crore business won't build a 50 crore business".
  A short yellow bar for 5 Cr, a "SAME SKILLS" chip that gets a red cross on "won't build",
  then a red bar that rises ten times taller while its label counts 5 -> 50, holds, and fades.
  Local times are cued to the speaker's words (the scene starts on "a 5 crore").
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Montserrat Rupee";
          src: url("assets/fonts/montserrat-latin-ext-900-normal.woff2") format("woff2");
          font-weight: 900;
          unicode-range: U+20B9;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Montserrat Rupee", "Montserrat", sans-serif;
          color: #f7f7f2;
        }
        .cr-stage {
          position: absolute;
          inset: 0;
          background: radial-gradient(120% 80% at 50% 38%, #24242b 0%, #0c0c0f 70%);
        }
        .cr-grid {
          position: absolute;
          inset: 0;
          background:
            repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.045) 0 2px, transparent 2px 96px),
            repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.045) 0 2px, transparent 2px 96px);
        }
        .cr-ground {
          position: absolute;
          left: 110px;
          right: 110px;
          top: 990px;
          height: 6px;
          border-radius: 3px;
          background: rgba(255, 255, 255, 0.3);
        }
        .cr-bar {
          position: absolute;
          bottom: 930px;
          width: 300px;
          border-radius: 18px 18px 0 0;
          transform-origin: 50% 100%;
        }
        .cr-bar-small {
          left: 180px;
          height: 64px;
          background: #ffe11a;
        }
        .cr-bar-big {
          left: 600px;
          height: 640px;
          background: linear-gradient(180deg, #ffe11a 0 18px, #ff2b2b 18px 100%);
          box-shadow: 0 0 80px rgba(255, 43, 43, 0.35);
        }
        .cr-label {
          position: absolute;
          width: 300px;
          text-align: center;
          font-weight: 900;
          letter-spacing: -0.03em;
          line-height: 1;
          white-space: nowrap;
        }
        .cr-label-small {
          left: 180px;
          bottom: 1019px;
          font-size: 86px;
          color: #f7f7f2;
        }
        .cr-label-big {
          left: 560px;
          width: 380px;
          bottom: 950px;
          font-size: 118px;
          color: #ffe11a;
          text-shadow: 0 6px 0 rgba(0, 0, 0, 0.55);
        }
        .cr-chip {
          position: absolute;
          left: 130px;
          top: 560px;
          width: 400px;
          height: 120px;
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: 18px;
          background: #f7f7f2;
          color: #0c0c0f;
          font-weight: 900;
          font-size: 58px;
          letter-spacing: -0.02em;
          box-shadow: 0 10px 0 rgba(0, 0, 0, 0.45);
        }
        .cr-cross {
          position: absolute;
          left: 130px;
          top: 520px;
          width: 400px;
          height: 200px;
        }
        .cr-cross-bar {
          position: absolute;
          left: 30px;
          top: 86px;
          width: 340px;
          height: 28px;
          border-radius: 14px;
          background: #ff2b2b;
          box-shadow: 0 0 24px rgba(255, 43, 43, 0.6);
        }
      </style>

      <div id="root" data-composition-id="broll-crore" data-width="1080" data-height="1920">
        <div class="cr-stage" id="cr-stage" data-layout-allow-overflow>
          <div class="cr-grid"></div>
          <div class="cr-ground"></div>
          <div class="cr-bar cr-bar-small" id="cr-bar-small"></div>
          <div class="cr-label cr-label-small" id="cr-label-small">₹5 CR</div>
          <div class="cr-chip" id="cr-chip" data-layout-allow-occlusion>SAME SKILLS</div>
          <div class="cr-cross" id="cr-cross">
            <div class="cr-cross-bar" id="cr-cross-a"></div>
            <div class="cr-cross-bar" id="cr-cross-b"></div>
          </div>
          <div class="cr-bar cr-bar-big" id="cr-bar-big"></div>
          <div class="cr-label cr-label-big" id="cr-label-big">₹5 CR</div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const bigLabel = document.getElementById("cr-label-big");
          // Calm pacing: every entrance eases out gently (no snaps, no shakes) at about half
          // the earlier speed, and the finished chart holds still so it can be read.

          // Enter: soft fade with a slight settle.
          tl.fromTo(
            "#cr-stage",
            { scale: 1.05, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.55, ease: "power2.out" },
            0,
          );

          // "a 5 crore business" -> the small bar grows and its label rises in.
          tl.fromTo("#cr-bar-small", { scaleY: 0 }, { scaleY: 1, duration: 0.7, ease: "power2.out" }, 0.22);
          tl.fromTo(
            "#cr-label-small",
            { opacity: 0, y: 24 },
            { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
            0.45,
          );

          // "won't build" -> SAME SKILLS chip eases in, then a red cross draws over it.
          tl.fromTo(
            "#cr-chip",
            { opacity: 0, y: 30, rotation: -3 },
            { opacity: 1, y: 0, rotation: -3, duration: 0.6, ease: "power2.out" },
            1.7,
          );
          tl.fromTo(
            "#cr-cross-a",
            { scaleX: 0, rotation: 24 },
            { scaleX: 1, rotation: 24, duration: 0.4, ease: "power2.out" },
            2.06,
          );
          tl.fromTo(
            "#cr-cross-b",
            { scaleX: 0, rotation: -24 },
            { scaleX: 1, rotation: -24, duration: 0.4, ease: "power2.out" },
            2.24,
          );
          tl.fromTo("#cr-chip", { opacity: 1 }, { opacity: 0.6, duration: 0.5, immediateRender: false }, 2.3);

          // "a 50 crore business" -> the big bar rises smoothly, the label rides it and counts 5 -> 50.
          tl.fromTo("#cr-bar-big", { scaleY: 0 }, { scaleY: 1, duration: 1.3, ease: "power3.out" }, 2.38);
          tl.fromTo(
            "#cr-label-big",
            { opacity: 0, y: 0 },
            { opacity: 1, y: -640, duration: 1.3, ease: "power3.out" },
            2.38,
          );
          const counter = { v: 5 };
          tl.fromTo(
            counter,
            { v: 5 },
            {
              v: 50,
              duration: 1.3,
              ease: "power3.out",
              onUpdate: function () {
                bigLabel.textContent = "₹" + Math.round(counter.v) + " CR";
              },
            },
            2.38,
          );

          // The finished chart holds (about 1.4 s), then fades away gently.
          tl.fromTo(
            "#cr-stage",
            { opacity: 1, scale: 1 },
            { opacity: 0, scale: 0.98, duration: 0.6, ease: "power2.inOut", immediateRender: false },
            5.1,
          );

          window.__timelines["broll-crore"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
